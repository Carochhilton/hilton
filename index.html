<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilton Garden Inn & Homewood Suites - Employee Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .language-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }

        .lang-btn {
            padding: 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            border-color: #378add;
            background: #f0f7ff;
        }

        .lang-btn.active {
            background: #378add;
            color: white;
            border-color: #378add;
        }

        .section {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .section.active {
            display: block;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin: 0 0 0.5rem 0;
            color: #333;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin: 0 0 1.5rem 0;
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin: 0 0 1rem 0;
            color: #333;
        }

        .policy-content {
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 1.5rem;
            color: #555;
        }

        .policy-content p {
            margin: 0.8rem 0;
        }

        .policy-content ol {
            margin: 1rem 0;
            padding-left: 1.5rem;
        }

        .policy-content li {
            margin: 0.6rem 0;
        }

        .policy-content strong {
            color: #333;
            font-weight: 600;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 1rem 0;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 4px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .checkbox-group label {
            cursor: pointer;
            font-size: 14px;
            flex: 1;
            color: #555;
        }

        .employee-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: #fafafa;
        }

        input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
            outline: none;
            border-color: #378add;
            background: white;
            box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.1);
        }

        .canvas-container {
            border: 1px solid #ddd;
            border-radius: 6px;
            margin: 1rem 0;
            background: white;
            min-height: 150px;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 100%;
            background: white;
            cursor: crosshair;
            border-radius: 6px;
        }

        .signature-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button {
            padding: 10px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
        }

        button:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .btn-primary {
            background: #378add;
            color: white;
            border: none;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #2a6bb8;
        }

        .progress-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 2rem;
        }

        .progress-step {
            flex: 1;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
        }

        .progress-step.active {
            background: #378add;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 1rem;
            border: 1px solid #fcc;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3a3;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 1rem;
            text-align: center;
            border: 1px solid #cfc;
        }

        .logo {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="form-container">
    <!-- LANGUAGE SELECTION -->
    <div id="langSelection">
        <div class="logo">Hilton Garden Inn & Homewood Suites Montréal Midtown</div>
        <h1>Sélectionnez votre langue / Select your language</h1>
        <p class="subtitle">Employee Integration Form</p>
        <div class="language-select">
            <button class="lang-btn active" onclick="selectLanguage('fr')">🇫🇷 Français</button>
            <button class="lang-btn" onclick="selectLanguage('en')">🇬🇧 English</button>
            <button class="lang-btn" onclick="selectLanguage('es')">🇪🇸 Español</button>
            <button class="lang-btn" onclick="selectLanguage('uk')">🇺🇦 Українська</button>
        </div>
    </div>

    <!-- FORM CONTAINER -->
    <div id="formContainer" style="display: none;">
        <div class="progress-bar" id="progressBar"></div>
        <div class="error-message" id="errorMsg"></div>

        <!-- STEP 1: Employee Info -->
        <div class="section active" id="step0">
            <h1 id="title0"></h1>
            <p class="subtitle" id="subtitle0"></p>
            <div class="employee-info">
                <input type="text" id="firstName" placeholder="" required>
                <input type="text" id="lastName" placeholder="" required>
                <input type="email" id="email" placeholder="" required>
                <input type="text" id="department" placeholder="" required>
                <input type="text" id="position" placeholder="" required>
            </div>
        </div>

        <!-- STEP 2: Employee Keys Policy -->
        <div class="section" id="step1">
            <h2 id="policy1Title"></h2>
            <div class="policy-content" id="policy1Content"></div>
            <div class="checkbox-group">
                <input type="checkbox" id="policy1" required>
                <label for="policy1" id="policy1Label"></label>
            </div>
        </div>

        <!-- STEP 3: Key Access Responsibility -->
        <div class="section" id="step2">
            <h2 id="policy2Title"></h2>
            <div class="policy-content" id="policy2Content"></div>
            <div class="checkbox-group">
                <input type="checkbox" id="policy2" required>
                <label for="policy2" id="policy2Label"></label>
            </div>
        </div>

        <!-- STEP 4: Signature -->
        <div class="section" id="step3">
            <h2 id="signatureTitle"></h2>
            <p class="subtitle" id="signatureSubtitle"></p>
            <div class="canvas-container">
                <canvas id="signatureCanvas"></canvas>
            </div>
            <div class="signature-controls">
                <button onclick="clearSignature()"><span id="clearBtnText">Effacer</span></button>
                <input type="text" id="signatureName" placeholder="" style="flex: 1; margin-left: 8px;">
            </div>
        </div>

        <!-- Navigation buttons -->
        <div class="nav-buttons">
            <button id="btnPrev" onclick="prevStep()" style="visibility: hidden;">← <span id="prevText">Précédent</span></button>
            <button id="btnNext" class="btn-primary" onclick="nextStep()"><span id="nextText">Suivant</span> →</button>
        </div>
    </div>
</div>

<script>
    let currentStep = 0;
    const totalSteps = 4;
    let currentLang = 'fr';
    let signatureCanvas, signatureContext;
    let isDrawing = false;

    const translations = {
        fr: {
            infoTitle: "Informations personnelles",
            welcomeSubtitle: "Veuillez compléter votre intégration",
            firstName: "Prénom",
            lastName: "Nom de famille",
            email: "Courriel",
            department: "Département",
            position: "Poste",

            policy1Title: "Contrat de responsabilité de la clé d'accès personnel de l'employé(e)",
            policy1Content: `<ol>
        <li>Je, <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>, reconnais avoir reçu une clé me donnant personnellement accès à la porte d'entrée dédiée aux membres de l'équipe du Hilton Garden Inn & Homewood Suites Montréal Midtown, ainsi qu'au vestiaire m'ayant été assigné.</li>
        <li>Je suis responsable de la bonne conservation de cette clé d'accès personnel.</li>
        <li>La clé ne doit pas être reproduite.</li>
        <li>Aucune perforation ne peut être faite à la clé.</li>
        <li>Ma clé d'accès personnel ne doit jamais être laissée sans surveillance.</li>
        <li>Tout bris ou perte de ma clé d'accès personnel doit être signalé immédiatement au supérieur immédiat.</li>
        <li>Des frais de <strong>dix dollars (10,00$)</strong> seront exigibles pour le remplacement de toutes clés dont j'ai la responsabilité. <strong>(10,00$ reverser à une association)</strong></li>
      </ol>
      <p>Par la présente, j'atteste avoir pris connaissance de la politique du contrôle de la clé d'accès personnel décrite plus haut et m'engage à la respecter.</p>
      <p><strong>Tout manque au respect de cette politique pourrait résulter en un avis disciplinaire et aller jusqu'à un congédiement selon la gravité de la situation.</strong></p>`,
            policy1Label: "Je reconnais avoir lu et compris cette politique",

            policy2Title: "Reconnaissance de l'employé(e)",
            policy2Content: `<p>J'ai reçu et compris les conditions énoncées ci-dessus concernant ma responsabilité envers la clé d'accès personnel qui m'a été remise. Je m'engage à respecter tous les points de cette politique.</p>
      <p>Je comprends que le non-respect de cette politique pourrait entraîner des mesures disciplinaires pouvant aller jusqu'au congédiement selon la gravité de la situation.</p>`,
            policy2Label: "Je reconnais avoir lu et accepte les conditions",

            signatureTitle: "Signature électronique",
            signatureSubtitle: "Veuillez signer ci-dessous pour confirmer votre compréhension et acceptation",
            clearBtnText: "Effacer",
            signatureNamePlaceholder: "Nom complet",
            prevText: "Précédent",
            nextText: "Suivant",
            finishText: "Terminer",
            successTitle: "Formulaire complété avec succès",
            successWelcome: "Bienvenue ",
            successDate: "Votre inscription a été enregistrée le ",
        },
        en: {
            infoTitle: "Personal information",
            welcomeSubtitle: "Please complete your integration",
            firstName: "First name",
            lastName: "Last name",
            email: "Email",
            department: "Department",
            position: "Position",

            policy1Title: "Employee Personal Access Key Responsibility Agreement",
            policy1Content: `<ol>
        <li>I, <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>, acknowledge having received a key providing me with personal access to the entrance door designated for team members of the Hilton Garden Inn & Homewood Suites Montréal Midtown, as well as to the locker room assigned to me.</li>
        <li>I am responsible for the proper safekeeping of this personal access key.</li>
        <li>The key must not be duplicated.</li>
        <li>No holes or perforations may be made in the key.</li>
        <li>My personal access key must never be left unattended.</li>
        <li>Any damage to or loss of my personal access key must be reported immediately to my immediate supervisor.</li>
        <li>A fee of <strong>ten dollars ($10.00)</strong> will be charged for the replacement of any key for which I am responsible. <strong>(The $10.00 fee will be donated to a charitable organization.)</strong></li>
      </ol>
      <p>By signing this document, I confirm that I have read and understood the personal access key control policy described above and agree to comply with it.</p>
      <p><strong>Failure to comply with this policy may result in disciplinary action, up to and including termination of employment, depending on the seriousness of the situation.</strong></p>`,
            policy1Label: "I acknowledge that I have read and understood this policy",

            policy2Title: "Employee Acknowledgment",
            policy2Content: `<p>I have received and understood the conditions outlined above regarding my responsibility for the personal access key that has been provided to me. I commit to complying with all points of this policy.</p>
      <p>I understand that failure to comply with this policy may result in disciplinary action up to and including termination of employment depending on the seriousness of the situation.</p>`,
            policy2Label: "I acknowledge that I have read and accept the conditions",

            signatureTitle: "Electronic signature",
            signatureSubtitle: "Please sign below to confirm your understanding and acceptance",
            clearBtnText: "Clear",
            signatureNamePlaceholder: "Full name",
            prevText: "Previous",
            nextText: "Next",
            finishText: "Finish",
            successTitle: "Form completed successfully",
            successWelcome: "Welcome ",
            successDate: "Your registration was recorded on ",
        },
        es: {
            infoTitle: "Información personal",
            welcomeSubtitle: "Por favor completa tu integración",
            firstName: "Nombre",
            lastName: "Apellido",
            email: "Correo electrónico",
            department: "Departamento",
            position: "Puesto",

            policy1Title: "Acuerdo de responsabilidad sobre la llave personal de acceso del empleado(a)",
            policy1Content: `<ol>
        <li>Yo, <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>, reconozco haber recibido una llave que me proporciona acceso personal a la puerta de entrada destinada a los miembros del equipo del Hilton Garden Inn & Homewood Suites Montréal Midtown, así como al vestuario que me ha sido asignado.</li>
        <li>Soy responsable de la correcta conservación y custodia de esta llave de acceso personal.</li>
        <li>La llave no debe ser duplicada.</li>
        <li>No se puede realizar ninguna perforación ni modificación en la llave.</li>
        <li>Mi llave de acceso personal nunca debe dejarse sin supervisión.</li>
        <li>Cualquier daño o pérdida de mi llave de acceso personal deberá ser comunicado inmediatamente a mi supervisor directo.</li>
        <li>Se cobrará una tarifa de <strong>diez dólares (10,00 $)</strong> por el reemplazo de cualquier llave de la cual sea responsable. <strong>(El importe de 10,00 $ será donado a una organización benéfica.)</strong></li>
      </ol>
      <p>Por medio de la presente, declaro haber leído y comprendido la política de control de la llave de acceso personal descrita anteriormente y me comprometo a respetarla.</p>
      <p><strong>El incumplimiento de esta política podrá dar lugar a medidas disciplinarias, que pueden llegar hasta la terminación del empleo, dependiendo de la gravedad de la situación.</strong></p>`,
            policy1Label: "Reconozco que he leído y comprendido esta política",

            policy2Title: "Reconocimiento del empleado(a)",
            policy2Content: `<p>He recibido y entendido las condiciones expuestas anteriormente sobre mi responsabilidad con respecto a la llave de acceso personal que me ha sido proporcionada. Me comprometo a cumplir con todos los puntos de esta política.</p>
      <p>Entiendo que el incumplimiento de esta política puede resultar en medidas disciplinarias que pueden llegar hasta la terminación del empleo dependiendo de la gravedad de la situación.</p>`,
            policy2Label: "Reconozco que he leído y acepto las condiciones",

            signatureTitle: "Firma electrónica",
            signatureSubtitle: "Por favor firma a continuación para confirmar tu comprensión y aceptación",
            clearBtnText: "Limpiar",
            signatureNamePlaceholder: "Nombre completo",
            prevText: "Anterior",
            nextText: "Siguiente",
            finishText: "Terminar",
            successTitle: "Formulario completado con éxito",
            successWelcome: "Bienvenido ",
            successDate: "Tu registro fue guardado el ",
        },
        uk: {
            infoTitle: "Особистої інформації",
            welcomeSubtitle: "Будь ласка, завершіть вашу інтеграцію",
            firstName: "Ім'я",
            lastName: "Прізвище",
            email: "Електронна пошта",
            department: "Відділ",
            position: "Посада",

            policy1Title: "Договір про відповідальність за персональний ключ доступу працівника",
            policy1Content: `<ol>
        <li>Я, <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>, визнаю, що отримав(ла) ключ, який забезпечує мені особистий доступ до вхідних дверей, призначених для членів команди Hilton Garden Inn & Homewood Suites Montréal Midtown, а також до гардеробної, що мені виділена.</li>
        <li>Я несу відповідальність за надлежне зберігання цього персонального ключа доступу.</li>
        <li>Ключ не повинен дублюватися.</li>
        <li>На ключі не можна робити жодних отворів або перфорацій.</li>
        <li>Мій персональний ключ доступу ніколи не повинен залишатися без нагляду.</li>
        <li>Будь-яке пошкодження або втрата мого персонального ключа доступу повинні бути негайно повідомлені моєму безпосередньому керівнику.</li>
        <li>Плата в розмірі <strong>десяти доларів (10,00 $)</strong> буде стягнута за заміну будь-якого ключа, за який я несу відповідальність. <strong>(Плата у розмірі 10,00 $ буде передана благодійній організації.)</strong></li>
      </ol>
      <p>Підписуючи цей документ, я підтверджую, що прочитав(ла) і зрозумів(ла) політику контролю персонального ключа доступу, описану вище, і погоджуюся її дотримуватися.</p>
      <p><strong>Невиконання цієї політики може призвести до дисциплінарних заходів, аж до припинення трудових відносин, залежно від серйозності ситуації.</strong></p>`,
            policy1Label: "Я визнаю, що прочитав(ла) і зрозумів(ла) цю політику",

            policy2Title: "Визнання працівника",
            policy2Content: `<p>Я отримав(ла) і зрозумів(ла) умови, викладені вище, щодо моєї відповідальності за персональний ключ доступу, який мені був наданий. Я зобов'язуюся дотримуватися всіх пунктів цієї політики.</p>
      <p>Я розумію, що невиконання цієї політики може призвести до дисциплінарних заходів, аж до припинення трудових відносин, залежно від серйозності ситуації.</p>`,
            policy2Label: "Я визнаю, що прочитав(ла) і приймаю умови",

            signatureTitle: "Електронний підпис",
            signatureSubtitle: "Будь ласка, підпишіть нижче, щоб підтвердити ваше розуміння і прийняття",
            clearBtnText: "Очистити",
            signatureNamePlaceholder: "Повне ім'я",
            prevText: "Попередній",
            nextText: "Далі",
            finishText: "Завершити",
            successTitle: "Форму успішно заповнено",
            successWelcome: "Ласкаво просимо ",
            successDate: "Ваша реєстрація була записана ",
        }
    };

    function selectLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('langSelection').style.display = 'none';
        document.getElementById('formContainer').style.display = 'block';

        updateLanguage();
        initializeForm();
        showStep(0);
    }

    function updateLanguage() {
        const t = translations[currentLang];

        document.getElementById('title0').textContent = t.infoTitle;
        document.getElementById('subtitle0').textContent = t.welcomeSubtitle;
        document.getElementById('firstName').placeholder = t.firstName;
        document.getElementById('lastName').placeholder = t.lastName;
        document.getElementById('email').placeholder = t.email;
        document.getElementById('department').placeholder = t.department;
        document.getElementById('position').placeholder = t.position;

        document.getElementById('policy1Title').textContent = t.policy1Title;
        document.getElementById('policy1Content').innerHTML = t.policy1Content;
        document.getElementById('policy1Label').textContent = t.policy1Label;

        document.getElementById('policy2Title').textContent = t.policy2Title;
        document.getElementById('policy2Content').innerHTML = t.policy2Content;
        document.getElementById('policy2Label').textContent = t.policy2Label;

        document.getElementById('signatureTitle').textContent = t.signatureTitle;
        document.getElementById('signatureSubtitle').textContent = t.signatureSubtitle;
        document.getElementById('signatureName').placeholder = t.signatureNamePlaceholder;
        document.getElementById('clearBtnText').textContent = t.clearBtnText;
        document.getElementById('prevText').textContent = t.prevText;
        document.getElementById('nextText').textContent = t.nextText;
    }

    function initializeForm() {
        const progressBar = document.getElementById('progressBar');
        progressBar.innerHTML = '';
        for (let i = 0; i < totalSteps; i++) {
            const step = document.createElement('div');
            step.className = 'progress-step';
            if (i === 0) step.classList.add('active');
            progressBar.appendChild(step);
        }
    }

    function initSignature() {
        signatureCanvas = document.getElementById('signatureCanvas');
        if (!signatureCanvas) return;

        signatureContext = signatureCanvas.getContext('2d');
        signatureCanvas.width = signatureCanvas.offsetWidth;
        signatureCanvas.height = 150;

        signatureContext.fillStyle = 'white';
        signatureContext.fillRect(0, 0, signatureCanvas.width, signatureCanvas.height);
        signatureContext.strokeStyle = '#333';
        signatureContext.lineWidth = 2;
        signatureContext.lineCap = 'round';
        signatureContext.lineJoin = 'round';

        signatureCanvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = signatureCanvas.getBoundingClientRect();
            signatureContext.beginPath();
            signatureContext.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });

        signatureCanvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                const rect = signatureCanvas.getBoundingClientRect();
                signatureContext.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                signatureContext.stroke();
            }
        });

        signatureCanvas.addEventListener('mouseup', () => isDrawing = false);
        signatureCanvas.addEventListener('mouseleave', () => isDrawing = false);
    }

    function clearSignature() {
        if (signatureCanvas) {
            signatureContext.fillStyle = 'white';
            signatureContext.fillRect(0, 0, signatureCanvas.width, signatureCanvas.height);
        }
    }

    function updateProgress() {
        const bars = document.querySelectorAll('.progress-step');
        bars.forEach((bar, idx) => {
            if (idx < currentStep) {
                bar.classList.add('active');
            } else {
                bar.classList.remove('active');
            }
        });
    }

    function showStep(step) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(`step${step}`).classList.add('active');

        document.getElementById('btnPrev').style.visibility = step === 0 ? 'hidden' : 'visible';
        const t = translations[currentLang];
        document.getElementById('btnNext').innerHTML = step === totalSteps - 1 ? `✓ ${t.finishText}` : `${t.nextText} →`;

        updateProgress();

        if (step === totalSteps - 1) {
            setTimeout(initSignature, 100);
        }
    }

    function validateStep(step) {
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.classList.remove('show');

        if (step === 0) {
            const fields = ['firstName', 'lastName', 'email', 'department', 'position'];
            for (let field of fields) {
                if (!document.getElementById(field).value) {
                    errorMsg.textContent = 'Please complete all fields';
                    errorMsg.classList.add('show');
                    return false;
                }
            }
        } else if (step > 0 && step < totalSteps - 1) {
            const checkboxId = `policy${step}`;
            if (!document.getElementById(checkboxId).checked) {
                errorMsg.textContent = 'Please acknowledge this policy';
                errorMsg.classList.add('show');
                return false;
            }
        }

        return true;
    }

    function nextStep() {
        if (!validateStep(currentStep)) return;

        if (currentStep === totalSteps - 1) {
            submitForm();
        } else {
            currentStep++;
            showStep(currentStep);
            window.scrollTo(0, 0);
        }
    }

    function prevStep() {
        if (currentStep > 0) {
            currentStep--;
            showStep(currentStep);
            window.scrollTo(0, 0);
        }
    }

    function submitForm() {
        const signatureName = document.getElementById('signatureName').value;
        if (!signatureName) {
            alert('Please enter your signature');
            return;
        }

        const t = translations[currentLang];
        const completionData = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            email: document.getElementById('email').value,
            department: document.getElementById('department').value,
            position: document.getElementById('position').value,
            language: currentLang,
            signature: signatureName,
            date: new Date().toLocaleDateString(),
            timestamp: new Date().toISOString()
        };

        localStorage.setItem('lastEmployeeIntegration', JSON.stringify(completionData));
        console.log('Form submitted:', completionData);

        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        const form = document.querySelector('.form-container');
        form.innerHTML = `
            <div class="success-message">
                <h2 style="margin: 0 0 1rem 0; font-size: 20px;">✓ ${t.successTitle}</h2>
                <p style="margin: 0 0 1rem 0;">${t.successWelcome}${completionData.firstName} ${completionData.lastName}!</p>
                <p style="margin: 0; font-size: 13px;">${t.successDate}${completionData.date}</p>
            </div>
        `;
    }
</script>
</body>
</html>
